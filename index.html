    <script>
      (function() {
        // Prevent third-party browser extensions (MetaMask, Web3 providers, etc.),
        // missing client_id warnings from Google Identity, and benign dev-server WebSocket messages from crashing or displaying errors
        function isIgnorable(msg) {
          if (!msg) return false;
          var str = '';
          if (typeof msg === 'string') {
            str = msg;
          } else if (msg instanceof Error) {
            str = (msg.message || '') + ' ' + (msg.stack || '');
          } else {
            try {
              str = JSON.stringify(msg) || String(msg);
            } catch(e) {
              str = String(msg);
            }
          }
          str = str.toLowerCase();
          return (
            str.includes('vite') ||
            str.includes('websocket') ||
            str.includes('ws://') ||
            str.includes('wss://') ||
            str.includes('metamask') ||
            str.includes('ethereum') ||
            str.includes('web3') ||
            str.includes('gsi_logger') ||
            str.includes('missing required parameter: client_id') ||
            str.includes('failed to connect to metamask')
          );
        }

        function makeFilter(orig) {
          return function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isIgnorable(arguments[i])) return;
            }
            var joined = Array.prototype.slice.call(arguments).map(function(a) {
              try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
            }).join(' ');
            if (isIgnorable(joined)) return;
            orig.apply(console, arguments);
          };
        }

        console.error = makeFilter(console.error);
        console.warn = makeFilter(console.warn);

        window.addEventListener('error', function(event) {
          var target = event.target;
          if (target && (target instanceof WebSocket || target.tagName === 'SCRIPT')) {
            var url = target.src || target.url || '';
            if (isIgnorable(url)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }
          var msg = event.message || (event.error && (event.error.message || event.error.stack)) || '';
          var file = event.filename || '';
          if (isIgnorable(msg) || isIgnorable(file)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (typeof reason === 'string' ? reason : reason && (reason.message || reason.stack)) || '';
          if (isIgnorable(msg) || isIgnorable(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
