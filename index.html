    <script>
      (function() {
        // Prevent third-party browser extensions (MetaMask, Web3 providers, etc.),
        // missing client_id warnings from Google Identity, and benign dev-server WebSocket messages from crashing or displaying errors
        function isIgnorable(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.includes('metamask') ||
            str.includes('ethereum') ||
            str.includes('web3') ||
            str.includes('[vite]') ||
            str.includes('websocket') ||
            str.includes('gsi_logger') ||
            str.includes('missing required parameter: client_id') ||
            str.includes('failed to connect to metamask')
          );
        }

        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a); }).join(' ');
          if (isIgnorable(joined)) {
            return;
          }
          originalConsoleError.apply(console, arguments);
        };

        var originalConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a); }).join(' ');
          if (isIgnorable(joined)) {
            return;
          }
          originalConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (isIgnorable(event.message) || isIgnorable(event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (typeof reason === 'string' ? reason : reason && reason.message) || '';
          if (isIgnorable(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-stone-950 text-stone-100 selection:bg-teal-500/30 selection:text-teal-200">
