<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#nav-grad)" stroke-width="8" opacity="0.8"/>
  <!-- Star / Compass Directions -->
  <circle cx="256" cy="76" r="6" fill="#fbbf24"/>
  <circle cx="256" cy="436" r="6" fill="#06b6d4"/>
  <circle cx="76" cy="256" r="6" fill="#06b6d4"/>
  <circle cx="436" cy="256" r="6" fill="#06b6d4"/>
  <!-- Lotus & Heart Center -->
  <path d="M256 120 C 275 180, 360 210, 360 270 C 360 330, 305 380, 256 400 C 207 380, 152 330, 152 270 C 152 210, 237 180, 256 120 Z" fill="url(#nav-grad)" opacity="0.25"/>
  <!-- Inner Compass Needle / Lotus Petals -->
  <path d="M256 130 L280 236 L386 256 L280 276 L256 382 L232 276 L126 256 L232 236 Z" fill="url(#nav-grad)"/>
  <!-- Golden Core -->
  <circle cx="256" cy="256" r="28" fill="url(#gold-grad)" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
</svg>
